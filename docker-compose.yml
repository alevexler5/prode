services:
  postgres:
    image: postgres:16-alpine
    container_name: prode-mundial-postgres
    environment:
      POSTGRES_DB: prode_mundial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - prode_mundial_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prode_mundial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prode_mundial_pgdata:
